name: openlivery

# Se aplica a todos los servicios.
#
# `no-new-privileges` impide que un proceso de adentro gane privilegios que no
# tenía al arrancar, por ejemplo ejecutando un binario setuid. Ninguno de estos
# contenedores lo necesita, y postgres tampoco: su entrypoint arranca como root
# y BAJA a su propio usuario, y bajar privilegios no es ganarlos.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  db:
    <<: *hardening
    # Un contenedor desbocado no puede llevarse puesta la máquina entera.
    # Los valores son un techo, no una reserva, y se suben desde .env.docker
    # sin editar este archivo: ver docs/es/configuration.md.
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-1.0}
    image: postgres:17.6-alpine
    container_name: openlivery_db
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/10-create-test-database.sh:/docker-entrypoint-initdb.d/10-create-test-database.sh:ro
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    <<: *hardening
    # Un contenedor desbocado no puede llevarse puesta la máquina entera.
    # Los valores son un techo, no una reserva, y se suben desde .env.docker
    # sin editar este archivo: ver docs/es/configuration.md.
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: ${API_CPU_LIMIT:-2.0}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: ${OPENLIVERY_IMAGE_PREFIX:-ghcr.io/sarrazola/openlivery}-api:${OPENLIVERY_VERSION:-latest}
    container_name: openlivery_api
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_TEST_DB}
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_URL: http://whatsapp:3101
      STORAGE_DIR: /app/backend/storage
    volumes:
      - backend_storage:/app/backend/storage
    ports:
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    <<: *hardening
    # Un contenedor desbocado no puede llevarse puesta la máquina entera.
    # Los valores son un techo, no una reserva, y se suben desde .env.docker
    # sin editar este archivo: ver docs/es/configuration.md.
    mem_limit: ${WEB_MEMORY_LIMIT:-512m}
    cpus: ${WEB_CPU_LIMIT:-1.0}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: ${OPENLIVERY_IMAGE_PREFIX:-ghcr.io/sarrazola/openlivery}-web:${OPENLIVERY_VERSION:-latest}
    container_name: openlivery_web
    environment:
      # Used server-side by proxy.ts to resolve custom portal domains.
      BACKEND_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  whatsapp:
    <<: *hardening
    # Un contenedor desbocado no puede llevarse puesta la máquina entera.
    # Los valores son un techo, no una reserva, y se suben desde .env.docker
    # sin editar este archivo: ver docs/es/configuration.md.
    mem_limit: ${WHATSAPP_MEMORY_LIMIT:-512m}
    cpus: ${WHATSAPP_CPU_LIMIT:-1.0}
    build:
      context: ./apps/whatsapp
      dockerfile: Dockerfile
    image: ${OPENLIVERY_IMAGE_PREFIX:-ghcr.io/sarrazola/openlivery}-whatsapp:${OPENLIVERY_VERSION:-latest}
    container_name: openlivery_whatsapp
    env_file:
      - .env.docker
    environment:
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: 3101
    expose:
      - "3101"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Single-origin gateway: the app is served here; "/api/*" goes to the backend
  # and everything else to the frontend. Put your own reverse proxy in front of
  # this port for TLS in production.
  proxy:
    <<: *hardening
    # Un contenedor desbocado no puede llevarse puesta la máquina entera.
    # Los valores son un techo, no una reserva, y se suben desde .env.docker
    # sin editar este archivo: ver docs/es/configuration.md.
    mem_limit: ${PROXY_MEMORY_LIMIT:-128m}
    cpus: ${PROXY_CPU_LIMIT:-0.5}
    build:
      context: ./docker/proxy
      dockerfile: Dockerfile
    image: ${OPENLIVERY_IMAGE_PREFIX:-ghcr.io/sarrazola/openlivery}-proxy:${OPENLIVERY_VERSION:-latest}
    container_name: openlivery_proxy
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # 8080 adentro porque el gateway corre sin root; el puerto de afuera no cambia.
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:8080"
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:
