name: CI

# Every project is checked here before anything is published. Until this
# workflow existed the only automation built and pushed images without running
# a single test, lint or type check.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are wasted work, but a push to main can be
  # halfway through pushing an image: cancelling that leaves the registry
  # holding a partial set of tags for the same commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: api (pytest + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openlivery
          POSTGRES_PASSWORD: openlivery
          POSTGRES_DB: openlivery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openlivery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The app refuses to start on the placeholder secrets published in this
      # repository, so CI supplies throwaway ones. These are not credentials:
      # the database is destroyed with the runner.
      SECRET_KEY: ci-only-secret-key
      ENCRYPTION_KEY: ci-only-encryption-key
      WHATSAPP_BRIDGE_TOKEN: ci-only-bridge-token
      RATE_LIMIT_ENABLED: "false"
      REPLY_DEBOUNCE_SECONDS: "0"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create the test database
        run: PGPASSWORD=openlivery createdb -h localhost -U openlivery openlivery_test

      # Runs the real migration chain end to end. The test suite builds its
      # schema from the models instead, so without this step a broken migration
      # would ship green.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://openlivery:openlivery@localhost:5432/openlivery
        run: alembic upgrade head

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://openlivery:openlivery@localhost:5432/openlivery_test
        run: pytest -q

  web:
    name: web (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Installed here rather than declared in package.json on purpose. The
      # image build runs `npm ci` (apps/web/Dockerfile:5), which fails when
      # package.json and package-lock.json disagree, and the lockfile cannot be
      # regenerated from a machine with no node_modules. TO FIX PROPERLY: run
      # `npm install -D vitest` once locally, commit the refreshed lockfile, and
      # delete this step.
      - name: Install the test runner
        run: npm install --no-save --no-audit --no-fund vitest@3.2.4

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  whatsapp:
    name: whatsapp (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/whatsapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/whatsapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: mobile (types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  scan:
    name: dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # This gates. The first run reported zero HIGH/CRITICAL findings across
      # all four manifests, so there is no pre-existing backlog to grandfather
      # in — which is the only reason a new scanner usually has to start in
      # report-only mode. Starting from clean means the first failure is a real
      # regression, introduced by the change that trips it.
      #
      # `ignore-unfixed` keeps it honest: it fails only on something the
      # ecosystem has already published a fix for, so the answer is always to
      # bump a version rather than to argue with the job.
      - name: Scan dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  publish:
    name: publish ${{ matrix.service }} image
    # The whole point of this job living here rather than in its own workflow:
    # `needs` only reaches jobs in the same file, so this is the only way to
    # make publishing wait on the checks. Across workflows it would take
    # `workflow_run`, which also fires when CI fails and checks out the branch
    # tip instead of the commit that passed.
    needs: [api, web, whatsapp, mobile, scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./apps/api
          - service: web
            context: ./apps/web
          - service: whatsapp
            context: ./apps/whatsapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openlivery-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
